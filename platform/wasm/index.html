<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>NBlood WebAssembly</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #120809; color: #f5e7e7; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(92vw, 900px); text-align: center; }
    h1 { letter-spacing: .08em; margin-bottom: .35rem; }
    p { color: #cdbbbb; }
    canvas { width: 100%; aspect-ratio: 8 / 5; background: #000; border: 1px solid #6d2929; box-shadow: 0 20px 70px #000b; image-rendering: pixelated; }
    #status { font-family: ui-monospace, monospace; color: #ffb0a6; }
  </style>
</head>
<body>
  <main>
    <h1>NBLOOD · WASM</h1>
    <p id="status">Loading WebAssembly…</p>
    <canvas id="canvas" width="640" height="400" tabindex="0"></canvas>
    <p>Click the canvas to focus the game. Add <code>?smoke=1</code> to run the platform diagnostic.</p>
  </main>
  <script>
    const canvas = document.getElementById('canvas');
    const status = document.getElementById('status');
    const assetVersion = '__ASSET_VERSION__';
    canvas.addEventListener('click', () => canvas.focus());
    var Module = {
      noInitialRun: true,
      canvas,
      locateFile: path => `${path}?v=${assetVersion}`,
      print: text => console.log(text),
      printErr: text => console.error(text),
      setStatus(text) {
        const download = text.match(/Downloading data\.\.\. \((\d+)\/(\d+)\)/);
        if (download) {
          const loaded = (Number(download[1]) / 1048576).toFixed(1);
          const total = (Number(download[2]) / 1048576).toFixed(1);
          status.textContent = `Downloading Blood data — ${loaded} / ${total} MB. Please wait; do not refresh.`;
        } else if (text === 'Downloading data...') {
          status.textContent = 'Downloading Blood data (about 65 MB). Please wait; do not refresh.';
        }
      },
      onRuntimeInitialized() {
        const smokeMode = new URLSearchParams(location.search).has('smoke');
        status.textContent = smokeMode ? 'Starting platform probe…' : 'Starting NBlood…';
        canvas.focus();
        Module.callMain(smokeMode ? ['--wasm-smoke-test'] : []);
      }
    };
  </script>
  <script src="nblood.js?v=__ASSET_VERSION__"></script>
</body>
</html>
