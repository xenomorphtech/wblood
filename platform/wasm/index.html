<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>NBlood WebAssembly</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #120809; color: #f5e7e7; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(92vw, 900px); text-align: center; }
    h1 { letter-spacing: .08em; margin-bottom: .35rem; }
    p { color: #cdbbbb; }
    canvas { width: 100%; aspect-ratio: 8 / 5; background: #000; border: 1px solid #6d2929; box-shadow: 0 20px 70px #000b; image-rendering: pixelated; }
    #status { font-family: ui-monospace, monospace; color: #ffb0a6; }
  </style>
</head>
<body>
  <main>
    <h1>NBLOOD · WASM</h1>
    <p id="status">Loading WebAssembly…</p>
    <canvas id="canvas" width="640" height="400" tabindex="0"></canvas>
    <p>Click the canvas to focus the game. Add <code>?smoke=1</code> to run the platform diagnostic.</p>
  </main>
  <script>
    const canvas = document.getElementById('canvas');
    const status = document.getElementById('status');
    const assetVersion = '__ASSET_VERSION__';
    let keyboardBridgeEnabled = false;
    const scanCodes = {
      Escape: 0x01, Digit1: 0x02, Digit2: 0x03, Digit3: 0x04, Digit4: 0x05,
      Digit5: 0x06, Digit6: 0x07, Digit7: 0x08, Digit8: 0x09, Digit9: 0x0a,
      Digit0: 0x0b, Backspace: 0x0e, Tab: 0x0f, KeyQ: 0x10, KeyW: 0x11,
      KeyE: 0x12, KeyR: 0x13, KeyT: 0x14, KeyY: 0x15, KeyU: 0x16,
      KeyI: 0x17, KeyO: 0x18, KeyP: 0x19, Enter: 0x1c, ControlLeft: 0x1d,
      KeyA: 0x1e, KeyS: 0x1f, KeyD: 0x20, KeyF: 0x21, KeyG: 0x22,
      KeyH: 0x23, KeyJ: 0x24, KeyK: 0x25, KeyL: 0x26, ShiftLeft: 0x2a,
      KeyZ: 0x2c, KeyX: 0x2d, KeyC: 0x2e, KeyV: 0x2f, KeyB: 0x30,
      KeyN: 0x31, KeyM: 0x32, ShiftRight: 0x36, AltLeft: 0x38, Space: 0x39,
      F1: 0x3b, F2: 0x3c, F3: 0x3d, F4: 0x3e, F5: 0x3f, F6: 0x40,
      F7: 0x41, F8: 0x42, F9: 0x43, F10: 0x44, F11: 0x57, F12: 0x58,
      ControlRight: 0x9d, AltRight: 0xb8, Home: 0xc7, ArrowUp: 0xc8,
      PageUp: 0xc9, ArrowLeft: 0xcb, ArrowRight: 0xcd, End: 0xcf,
      ArrowDown: 0xd0, PageDown: 0xd1, Insert: 0xd2, Delete: 0xd3
    };
    const bridgeKey = (event, pressed) => {
      const scanCode = scanCodes[event.code];
      if (!keyboardBridgeEnabled || scanCode === undefined || typeof Module._wasmInjectKey !== 'function') return;
      Module._wasmInjectKey(scanCode, pressed ? 1 : 0);
      event.preventDefault();
      event.stopImmediatePropagation();
    };
    addEventListener('keydown', event => bridgeKey(event, true), true);
    addEventListener('keyup', event => bridgeKey(event, false), true);
    canvas.addEventListener('click', () => canvas.focus());
    var Module = {
      noInitialRun: true,
      canvas,
      locateFile: path => `${path}?v=${assetVersion}`,
      print: text => console.log(text),
      printErr: text => console.error(text),
      setStatus(text) {
        const download = text.match(/Downloading data\.\.\. \((\d+)\/(\d+)\)/);
        if (download) {
          const loaded = (Number(download[1]) / 1048576).toFixed(1);
          const total = (Number(download[2]) / 1048576).toFixed(1);
          status.textContent = `Downloading Blood data — ${loaded} / ${total} MB. Please wait; do not refresh.`;
        } else if (text === 'Downloading data...') {
          status.textContent = 'Downloading Blood data (about 65 MB). Please wait; do not refresh.';
        }
      },
      onRuntimeInitialized() {
        const smokeMode = new URLSearchParams(location.search).has('smoke');
        keyboardBridgeEnabled = !smokeMode;
        status.textContent = smokeMode ? 'Starting platform probe…' : 'Starting NBlood…';
        canvas.focus();
        Module.callMain(smokeMode ? ['--wasm-smoke-test'] : ['-nodemo']);
      }
    };
  </script>
  <script src="nblood.js?v=__ASSET_VERSION__"></script>
</body>
</html>
